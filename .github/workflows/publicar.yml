# Publica la app en GitHub Pages en cada cambio de la rama principal.
#
# Antes de que esto sirva hay que habilitar Pages una vez, en el repositorio:
#   Settings → Pages → Source: GitHub Actions
#
# Y ajustar RFLOWP_BASE abajo al nombre del repositorio. Si publicas en un sitio
# de usuario (usuario.github.io) déjalo en "/"; si publicas en un repositorio
# normal, la app vive en una subcarpeta y hay que decirlo, o la instalación de
# la PWA apuntará a una dirección que no existe.

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos cambios seguidos, se publica el último y se cancela el
# anterior: no tiene sentido desplegar una versión que ya quedó vieja.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Las pruebas corren antes de publicar: una app rota en producción le
      # cuesta la clase a un grupo entero.
      - run: npm test

      - run: npm run build
        env:
          # ▼ Cámbialo por "/nombre-del-repositorio/" si no es un sitio de usuario.
          RFLOWP_BASE: /

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
